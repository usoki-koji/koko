license = "GNU General Public License v3.0"

[[mods]]
    modId = "koko"
    displayName = "Koko"
    version = "1.0.0"
    authors = "Koji Usoki"
    description = "Koko is a modular mod that allows you to add your own skills, their xp sources and effects."
    #logoFile = ""

[[mixins]]
    config = "koko.mixins.json"

[[dependencies."koko"]]
