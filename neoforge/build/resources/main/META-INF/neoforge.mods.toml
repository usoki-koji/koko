    side = "BOTH"

[[dependencies."koko"]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."koko"]]
    modId = "kotlinforforge"
    type = "required"
    versionRange = "[5.9]"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."koko"]]
    modId = "curios"
    type = "optional"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."koko"]]
    modId = "irons_spellbooks"
    type = "optional"
    ordering = "AFTER"
    side = "BOTH"
